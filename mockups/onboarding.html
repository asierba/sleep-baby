<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding — Birthdate Entry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f0f5;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: #1a1a2e;
  }
  .phone {
    width: 390px;
    min-height: 844px;
    background: #f8f8fc;
    border-radius: 40px;
    border: 8px solid #1a1a2e;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 54px;
    background: #f8f8fc;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    color: #1a1a2e;
    font-size: 14px;
    font-weight: 600;
  }
  .onboarding-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 32px;
  }
  .illustration {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #dfe6fd 0%, #e8e0ff 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    margin-bottom: 32px;
  }
  .welcome {
    font-size: 14px;
    font-weight: 600;
    color: #6c5ce7;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 15px;
    color: #888;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 40px;
  }
  .date-input-group {
    width: 100%;
    margin-bottom: 16px;
  }
  .date-label {
    font-size: 13px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .date-fields {
    display: flex;
    gap: 10px;
  }
  .date-field {
    flex: 1;
    background: white;
    border: 2px solid #e8e0ff;
    border-radius: 14px;
    padding: 14px 12px;
    text-align: center;
    font-size: 20px;
    font-weight: 600;
    color: #1a1a2e;
    outline: none;
    transition: border-color 0.2s;
  }
  .date-field:focus {
    border-color: #6c5ce7;
  }
  .date-field::placeholder {
    color: #ccc;
    font-weight: 400;
  }
  .date-field-label {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    margin-top: 4px;
  }
  .age-preview {
    width: 100%;
    background: #f0eaff;
    border-radius: 12px;
    padding: 12px 16px;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .age-preview-icon {
    font-size: 20px;
  }
  .age-preview-text {
    font-size: 14px;
    color: #6c5ce7;
    font-weight: 600;
  }
  .spacer {
    flex: 1;
  }
  .continue-btn {
    width: 100%;
    padding: 16px 0;
    border: none;
    border-radius: 16px;
    background: #6c5ce7;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(108,92,231,0.3);
    margin-bottom: 16px;
  }
  .continue-btn:active {
    transform: scale(0.98);
  }
  .privacy-note {
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">9:41</div>

  <div class="onboarding-content">
    <div class="illustration">👶</div>

    <div class="welcome">Welcome to Sleepy Baby</div>
    <h1>When was your baby born?</h1>
    <div class="subtitle">We use this to calculate age-appropriate sleep windows for your baby.</div>

    <div class="date-input-group">
      <div class="date-label">Birthdate</div>
      <div class="date-fields">
        <div style="flex: 1.2;">
          <input type="text" class="date-field" placeholder="MM" value="08" maxlength="2">
          <div class="date-field-label">Month</div>
        </div>
        <div style="flex: 1.2;">
          <input type="text" class="date-field" placeholder="DD" value="10" maxlength="2">
          <div class="date-field-label">Day</div>
        </div>
        <div style="flex: 1.5;">
          <input type="text" class="date-field" placeholder="YYYY" value="2025" maxlength="4">
          <div class="date-field-label">Year</div>
        </div>
      </div>
    </div>

    <div class="age-preview">
      <span class="age-preview-icon">🎂</span>
      <span class="age-preview-text">6 months old &mdash; 2–3 naps per day</span>
    </div>

    <div class="spacer"></div>

    <button class="continue-btn">Get Started</button>
    <div class="privacy-note">All data stays on your device. No account needed.</div>
  </div>
</div>
</body>
</html>
