<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Onboarding — Birthdate Entry</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f0f0f5;
    display: flex;
    justify-content: center;
    padding: 20px;
    color: #1a1a2e;
  }
  .phone {
    width: 390px;
    min-height: 844px;
    background: #f8f8fc;
    border-radius: 40px;
    border: 8px solid #1a1a2e;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status-bar {
    height: 54px;
    background: #f8f8fc;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 8px;
    color: #1a1a2e;
    font-size: 14px;
    font-weight: 600;
  }
  .onboarding-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 32px;
  }
  .illustration {
    width: 120px;
    height: 120px;
    background: linear-gradient(135deg, #dfe6fd 0%, #e8e0ff 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    margin-bottom: 32px;
  }
  .welcome {
    font-size: 14px;
    font-weight: 600;
    color: #6c5ce7;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    text-align: center;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 15px;
    color: #888;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 40px;
  }
  .date-picker-btn {
    width: 100%;
    background: white;
    border: 2px solid #e8e0ff;
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .date-picker-btn:active {
    border-color: #6c5ce7;
  }
  .date-picker-label {
    font-size: 13px;
    font-weight: 600;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .date-picker-value {
    font-size: 20px;
    font-weight: 600;
    color: #1a1a2e;
    margin-top: 4px;
  }
  .date-picker-chevron {
    font-size: 20px;
    color: #ccc;
  }
  .age-preview {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #f0eaff;
    border-radius: 20px;
    padding: 8px 16px;
    margin-top: 12px;
  }
  .age-preview-icon {
    font-size: 20px;
  }
  .age-preview-text {
    font-size: 14px;
    color: #6c5ce7;
    font-weight: 600;
  }
  .spacer {
    flex: 1;
  }
  .continue-btn {
    width: 100%;
    padding: 16px 0;
    border: none;
    border-radius: 16px;
    background: #6c5ce7;
    color: white;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(108,92,231,0.3);
    margin-bottom: 16px;
  }
  .continue-btn:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
<div class="phone">
  <div class="status-bar">9:41</div>

  <div class="onboarding-content">
    <div class="illustration">👶</div>

    <div class="welcome">Welcome to Sleepy Baby</div>
    <h1>When was your baby born?</h1>
    <div class="subtitle">We use this to calculate age-appropriate sleep windows for your baby.</div>

    <div class="date-picker-btn">
      <div>
        <div class="date-picker-label">Birthdate</div>
        <div class="date-picker-value">August 10, 2025</div>
      </div>
      <div class="date-picker-chevron">›</div>
    </div>

    <div class="age-preview">
      <span class="age-preview-icon">🎂</span>
      <span class="age-preview-text">6 months old</span>
    </div>

    <div class="spacer"></div>

    <button class="continue-btn">Get Started</button>
  </div>
</div>
</body>
</html>
